name: Build & Deploy to k3s

on:
  push:
    branches: ["main"]

env:
  REGISTRY: mesuitc.duckdns.org:5000
  BACKEND_IMAGE: alfa-backend
  FRONTEND_IMAGE: alfa-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Разрешаем Docker CLI работать с HTTP реестром (нужно для docker/login-action)
      - name: Configure Docker daemon for insecure registry
        run: |
          echo '{"insecure-registries":["mesuitc.duckdns.org:5000"]}' | sudo tee /etc/docker/daemon.json
          sudo systemctl reload docker

      # 2. Разрешаем Buildx работать с HTTP реестром (нужно для docker/build-push-action)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          config-inline: |
            [registry."mesuitc.duckdns.org:5000"]
              http = true
              insecure = true

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./cash
          file: ./cash/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest

      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/ProdDockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Setup k3s kubectl
        uses: azure/setup-k3s kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K3S_KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Backend image
        run: |
          k3s kubectl set image deployment/backend \
            backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            -n alfa

      - name: Update Frontend image
        run: |
          k3s kubectl set image deployment/frontend \
            frontend=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -n alfa

      - name: Wait for rollout
        run: |
          k3s kubectl rollout status deployment/backend -n alfa --timeout=180s
          k3s kubectl rollout status deployment/frontend -n alfa --timeout=180s