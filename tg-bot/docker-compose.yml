services:
  bot:
    build: ./app
    container_name: interview-tg-bot
    restart: unless-stopped
    env_file: ./app/.env
    # Бот работает через long polling — входящие порты не нужны.
    # network_mode: host — бот видит localhost хоста: API через опубликованный nginx
    # (API_BASE_URL=http://localhost:88) и локальный прокси для Telegram (TELEGRAM_PROXY),
    # если Telegram напрямую недоступен. Работает на Linux.
    network_mode: host
