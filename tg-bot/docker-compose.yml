services:
  bot:
    build: ./app
    container_name: interview-tg-bot
    restart: unless-stopped
    env_file: ./app/.env
    # Бот работает через long polling — входящие порты не нужны.
    # API на хосте: API_BASE_URL=http://host.docker.internal:8080 (на Linux нужна строка ниже)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # API в другом compose-проекте: бот подключается к сети основного compose
    # и ходит на nginx (он убирает префикс /api): API_BASE_URL=http://nginx_react:88
    networks: [platform]
networks:
  platform:
    external: true
    name: projecttoalfa_front
