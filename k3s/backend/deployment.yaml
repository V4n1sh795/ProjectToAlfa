apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: alfa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # ← Замените на ваш registry
          image: 192.168.0.159:30500/alfa-backend:latest
          ports:
            - containerPort: 8080   # Стандартный порт ASP.NET Core 8+
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            # Connection string собираем из Secret
            - name: ConnectionStrings__DefaultConnection
              value: "Host=postgres-svc;Database=$(POSTGRES_DB);Username=$(POSTGRES_USER);Password=$(POSTGRES_PASSWORD)"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          # ASP.NET health check (если у вас есть HealthChecks endpoint)
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      dnsPolicy: Default
      dnsConfig:
        nameservers:
          - 8.8.8.8
          - 8.8.4.4